<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img"><title>Why serving is slow: prefill, decode, KV cache and queues</title><rect width="920" height="420" fill="#faf8f2"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#216c82"/></marker></defs><rect x="40" y="40" width="385" height="135" rx="10" fill="#e0edf0" stroke="#171612" stroke-width="1.5"/><text x="60" y="68" font-family="sans-serif" font-size="16" fill="#216c82">01</text><text x="60" y="104" font-family="Arial,sans-serif" font-size="20" fill="#171612">Request arrival</text><text x="60" y="131" font-family="Arial,sans-serif" font-size="20" fill="#171612">Queue / tokenize</text><rect x="495" y="40" width="385" height="135" rx="10" fill="#f3e6d1" stroke="#171612" stroke-width="1.5"/><text x="515" y="68" font-family="sans-serif" font-size="16" fill="#216c82">02</text><text x="515" y="104" font-family="Arial,sans-serif" font-size="20" fill="#171612">Prefill</text><text x="515" y="131" font-family="Arial,sans-serif" font-size="20" fill="#171612">Build prompt KV</text><rect x="40" y="235" width="385" height="135" rx="10" fill="#e5e8d9" stroke="#171612" stroke-width="1.5"/><text x="60" y="263" font-family="sans-serif" font-size="16" fill="#216c82">03</text><text x="60" y="299" font-family="Arial,sans-serif" font-size="20" fill="#171612">Decode iterations</text><text x="60" y="326" font-family="Arial,sans-serif" font-size="20" fill="#171612">Read KV + generate token</text><rect x="495" y="235" width="385" height="135" rx="10" fill="#f5d6cd" stroke="#171612" stroke-width="1.5"/><text x="515" y="263" font-family="sans-serif" font-size="16" fill="#216c82">04</text><text x="515" y="299" font-family="Arial,sans-serif" font-size="20" fill="#171612">Finish or timeout</text><text x="515" y="326" font-family="Arial,sans-serif" font-size="20" fill="#171612">TTFT / ITL / goodput</text><path d="M425 108 H488" str