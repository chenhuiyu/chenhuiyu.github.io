<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">DIGER · Differentiable Semantic ID</title><desc id="desc">Hard tokens forward, soft gradients backward</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17212B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17212B" flood-opacity=".10"/></filter></defs><rect width="1200" height="675" rx="32" fill="#F4F0E8"/><text x="70" y="82" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" fill="#17212B">DIGER · Differentiable Semantic ID</text><text x="70" y="118" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#6D746F">Hard tokens forward, soft gradients backward</text><path d="M300 295 C335 295 350 295 390 295" fill="none" stroke="#17212B" stroke-width="3" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="328" y="278" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6D746F">encode</text><path d="M660 295 C700 295 720 295 760 295" fill="none" stroke="#17212B" stroke-width="3" stroke-dasharray="0" marker-end="url(#arrow)"/><text x="688" y="278" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6D746F">hard SID</text><path d="M885 370 C870 455 680 505 620 510" fill="none" stroke="#6E8B74" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="740" y="470" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6D746F">soft update</text><path d="M430 510 C350 510 330 390 420 350" fill="none" stroke="#6E8B74" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/><rect x="70" y="220" width="230" height="150" rx="22" fill="#FFFDF8" stroke="#7A628A" stroke-width="3" filter="url(#shadow)"/><rect x="70" y="220" width="10" height="150" rx="5" fill="#7A628A"/><text x="98" y="260" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#7A628A">ITEM CONTENT</text><text x="98" y="292" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">Text and multimodal</text><text x="98" y="318" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">embedding</text><rect x="390" y="190" width="270" height="210" rx="22" fill="#FFFDF8" stroke="#D9835B" stroke-width="3" filter="url(#shadow)"/><rect x="390" y="190" width="10" height="210" rx="5" fill="#D9835B"/><text x="418" y="230" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#D9835B">DRIL TOKENIZER</text><text x="418" y="262" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">Gumbel exploration and</text><text x="418" y="288" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">uncertainty decay</text><rect x="760" y="220" width="250" height="150" rx="22" fill="#FFFDF8" stroke="#567189" stroke-width="3" filter="url(#shadow)"/><rect x="760" y="220" width="10" height="150" rx="5" fill="#567189"/><text x="788" y="260" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#567189">GENERATOR</text><text x="788" y="292" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">Next Semantic ID</text><text x="788" y="318" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">prediction</text><rect x="430" y="465" width="190" height="95" rx="22" fill="#FFFDF8" stroke="#6E8B74" stroke-width="3" filter="url(#shadow)"/><rect x="430" y="465" width="10" height="95" rx="5" fill="#6E8B74"/><text x="458" y="505" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#6E8B74">LOSS</text><text x="458" y="537" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">Recommendation gradient</text><line x1="70" y1="606" x2="1130" y2="606" stroke="#C8C1B5" stroke-width="2"/><text x="70" y="642" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#6D746F">The tokenizer is no longer preprocessing. It becomes part of the recommendation objective.</text></svg>