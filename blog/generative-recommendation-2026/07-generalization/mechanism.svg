<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Generalization Audit</title><desc id="desc">Item-level novelty can still be token-level memory</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17212B"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17212B" flood-opacity=".10"/></filter></defs><rect width="1200" height="675" rx="32" fill="#F4F0E8"/><text x="70" y="82" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" fill="#17212B">Generalization Audit</text><text x="70" y="118" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#6D746F">Item-level novelty can still be token-level memory</text><path d="M305 300 C325 300 345 300 365 300" fill="none" stroke="#17212B" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/><path d="M615 300 C635 300 655 300 675 300" fill="none" stroke="#17212B" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/><path d="M925 300 C950 300 970 300 995 300" fill="none" stroke="#17212B" stroke-width="3" stroke-dasharray="0" marker-end="url(#arrow)"/><rect x="55" y="210" width="250" height="180" rx="22" fill="#FFFDF8" stroke="#567189" stroke-width="3" filter="url(#shadow)"/><rect x="55" y="210" width="10" height="180" rx="5" fill="#567189"/><text x="83" y="250" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#567189">TEST BUCKET A</text><text x="83" y="282" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">Seen item transition:</text><text x="83" y="308" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">memorization</text><rect x="365" y="210" width="250" height="180" rx="22" fill="#FFFDF8" stroke="#7A628A" stroke-width="3" filter="url(#shadow)"/><rect x="365" y="210" width="10" height="180" rx="5" fill="#7A628A"/><text x="393" y="250" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#7A628A">TEST BUCKET B</text><text x="393" y="282" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">Unseen item, familiar</text><text x="393" y="308" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">token paths</text><rect x="675" y="210" width="250" height="180" rx="22" fill="#FFFDF8" stroke="#D9835B" stroke-width="3" filter="url(#shadow)"/><rect x="675" y="210" width="10" height="180" rx="5" fill="#D9835B"/><text x="703" y="250" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#D9835B">TEST BUCKET C</text><text x="703" y="282" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">Sparse item and token</text><text x="703" y="308" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">evidence</text><rect x="995" y="210" width="155" height="180" rx="22" fill="#FFFDF8" stroke="#6E8B74" stroke-width="3" filter="url(#shadow)"/><rect x="995" y="210" width="10" height="180" rx="5" fill="#6E8B74"/><text x="1023" y="250" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#6E8B74">ROUTER</text><text x="1023" y="282" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">Atomic ID, SID, or blend</text><line x1="70" y1="606" x2="1130" y2="606" stroke="#C8C1B5" stroke-width="2"/><text x="70" y="642" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#6D746F">Aggregate NDCG is a fog. Bucketed evaluation reveals which capability produced the gain.</text></svg>