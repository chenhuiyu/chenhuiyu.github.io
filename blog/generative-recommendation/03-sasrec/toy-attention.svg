<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">历史很长，但真正相关的可能只有几步 / Toy attention</title>
  <desc id="desc">颜色条仅解释机制，不是论文中的真实个体 attention 权重。</desc>
