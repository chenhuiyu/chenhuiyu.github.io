<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">同一位用户，四种问法 / P5 toy prompts</title>
  <desc id="desc">历史固定为网球拍 → 攀岩鞋 → 羽毛球 → 泳镜；模板决定当前任务。</desc>
  <rect width="1600" height="900" fill="#faf7f0"/>
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="82" fill="#171612" font-size="42" font-weight="650" text-anchor="start">同一位用户，四种问法 / P5 toy prompts</text>
  <text x="80" y="124" fill="#6f6a61" font-size="21" font-weight="400" text-anchor="start">历史固定为网球拍 → 攀岩鞋 → 羽毛球 → 泳镜；模板决定当前任务。</text>
    <rect x="77" y="220" width="335" height="420" rx="28" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="111" y="270" fill="#1d4ed8" font-size="17" font-weight="750" text-anchor="start">01</text>
      <text x="111" y="325" fill="#171612" font-size="27" font-weight="650" text-anchor="start">评分 / Rating</text>
      <text x="111" y="385" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">小林会给 I03</text>
<text x="111" y="430" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">多少星？</text>
<text x="111" y="475" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">→ “5”</text>
<rect x="447" y="220" width="335" height="420" rx="28" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="481" y="270" fill="#6d28d9" font-size="17" font-weight="750" text-anchor="start">02</text>
      <text x="481" y="325" fill="#171612" font-size="27" font-weight="650" text-anchor="start">下一项 / Next</text>
      <text x="481" y="385" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">看过 I01,I03,I05</text>
<text x="481" y="430" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">接下来是什么？</text>
<text x="481" y="475" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">→ “I06”</text>
<rect x="817" y="220" width="335" height="420" rx="28" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
      <text x="851" y="270" fill="#92400e" font-size="17" font-weight="750" text-anchor="start">03</text>
      <text x="851" y="325" fill="#171612" font-size="27" font-weight="650" text-anchor="start">解释 / Explain</text>
      <text x="851" y="385" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">为什么推荐 I03？</text>
<text x="851" y="430" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">结合用户与商品</text>
<text x="851" y="475" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">→ 一句话</text>
<rect x="1187" y="220" width="335" height="420" rx="28" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="1221" y="270" fill="#166534" font-size="17" font-weight="750" text-anchor="start">04</text>
      <text x="1221" y="325" fill="#171612" font-size="27" font-weight="650" text-anchor="start">直接推荐 / Direct</text>
      <text x="1221" y="385" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">I06 与 I07 中</text>
<text x="1221" y="430" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">哪件更适合？</text>
<text x="1221" y="475" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">→ “I06”</text>
    <rect x="235" y="705" width="1130" height="100" rx="25" fill="#ffffff" stroke="#c9c0b3" stroke-width="2"/>
    <text x="800" y="765" fill="#171612" font-size="22" font-weight="650" text-anchor="middle">原始行为没有变；P5 用 personalized prompt 把它重组为 input–target token pairs。</text>
  </g>
</svg>
