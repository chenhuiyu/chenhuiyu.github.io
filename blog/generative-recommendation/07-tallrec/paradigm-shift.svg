<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">会语言，不等于会判断偏好 / TALLRec</title>
  <desc id="desc">通用 LLM 的预训练目标与推荐任务错位；少量 recommendation instruction 才是桥。</desc>
  <rect width="1600" height="900" fill="#faf7f0"/>
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="82" fill="#171612" font-size="42" font-weight="650" text-anchor="start">会语言，不等于会判断偏好 / TALLRec</text>
  <text x="80" y="124" fill="#6f6a61" font-size="21" font-weight="400" text-anchor="start">通用 LLM 的预训练目标与推荐任务错位；少量 recommendation instruction 才是桥。</text>
    <rect x="90" y="225" width="575" height="420" rx="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="135" y="285" fill="#1d4ed8" font-size="18" font-weight="750" text-anchor="start">ZERO-SHOT LLM</text>
    <text x="135" y="342" fill="#171612" font-size="34" font-weight="650" text-anchor="start">懂电影，却不懂点击规律</text>
    <text x="135" y="408" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">世界知识丰富</text>
<text x="135" y="458" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">能理解自然语言</text>
<text x="135" y="508" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">推荐 AUC 接近随机</text>
<text x="135" y="558" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">训练语料缺少偏好监督</text>
    <line x1="695" y1="435" x2="887" y2="435" stroke="#8b5cf6" stroke-width="5"/>
  <path d="M881 422 L905 435 L881 448" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="708" y="365" width="174" height="62" rx="31" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="795" y="405" fill="#6d28d9" font-size="20" font-weight="750" text-anchor="middle">SFT</text>
    <rect x="935" y="225" width="575" height="420" rx="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="980" y="285" fill="#166534" font-size="18" font-weight="750" text-anchor="start">REC-TUNED LLM</text>
    <text x="980" y="342" fill="#171612" font-size="34" font-weight="650" text-anchor="start">把偏好变成可学习指令</text>
    <text x="980" y="408" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">喜欢 / 不喜欢历史</text>
<text x="980" y="458" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">目标商品文本</text>
<text x="980" y="508" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">输出 Yes 或 No</text>
<text x="980" y="558" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">LoRA 只更新低秩参数</text>
    <line x1="90" y1="710" x2="1510" y2="710" stroke="#c9c0b3" stroke-width="2" stroke-dasharray="10 10"/>
    <text x="800" y="785" fill="#92400e" font-size="24" font-weight="650" text-anchor="middle">TALLRec 的核心证据：能力不是靠 prompt 自动“唤醒”，而是靠少量域内监督完成对齐。</text>
  </g>
</svg>
