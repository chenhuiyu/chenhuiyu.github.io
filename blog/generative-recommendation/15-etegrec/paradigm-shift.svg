<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tokenizer 不该只在训练前出现一次 / ETEGRec</title><desc id="desc">离线 tokenizer 不知道下游生成器学得好不好；ETEGRec 让两者用推荐目标互相校准。</desc>
  <rect width="1600" height="900" fill="#faf7f0"/>
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="80" y="82" fill="#171612" font-size="42" font-weight="650" text-anchor="start">Tokenizer 不该只在训练前出现一次 / ETEGRec</text><text x="80" y="124" fill="#6f6a61" font-size="21" font-weight="400" text-anchor="start">离线 tokenizer 不知道下游生成器学得好不好；ETEGRec 让两者用推荐目标互相校准。</text>
    <rect x="90" y="225" width="575" height="420" rx="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="135" y="285" fill="#1d4ed8" font-size="18" font-weight="750" text-anchor="start">DECOUPLED</text>
    <text x="135" y="342" fill="#171612" font-size="34" font-weight="650" text-anchor="start">先建码，随后永久冻结</text>
    <text x="135" y="408" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">tokenizer 自己重构</text>
<text x="135" y="458" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">生成器接受既定 IDs</text>
<text x="135" y="508" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">下游错误无法反馈</text>
<text x="135" y="558" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">两套表示可能错位</text>
    <line x1="695" y1="435" x2="887" y2="435" stroke="#8b5cf6" stroke-width="5"/>
  <path d="M881 422 L905 435 L881 448" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="708" y="365" width="174" height="62" rx="31" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="795" y="405" fill="#6d28d9" font-size="20" font-weight="750" text-anchor="middle">feedback</text>
    <rect x="935" y="225" width="575" height="420" rx="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="980" y="285" fill="#166534" font-size="18" font-weight="750" text-anchor="start">END-TO-END ALIGNED</text>
    <text x="980" y="342" fill="#171612" font-size="34" font-weight="650" text-anchor="start">建码与偏好模型交替演化</text>
    <text x="980" y="408" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">sequence → item distribution</text>
<text x="980" y="458" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">preference ↔ semantics</text>
<text x="980" y="508" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">周期性交替优化</text>
<text x="980" y="558" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">收敛后再冻结</text>
    <line x1="90" y1="710" x2="1510" y2="710" stroke="#c9c0b3" stroke-width="2" stroke-dasharray="10 10"/>
    <text x="800" y="785" fill="#92400e" font-size="24" font-weight="650" text-anchor="middle">端到端的核心不是一次反向传播穿过 argmax，而是让两个组件在训练过程中交换监督。</text></g>
</svg>
