<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">从文档 ID 到商品 Semantic ID / TIGER</title><desc id="desc">DSI 证明 ID 可以生成；TIGER 让商品 ID 本身携带内容语义与层次结构。</desc>
  <rect width="1600" height="900" fill="#faf7f0"/>
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="80" y="82" fill="#171612" font-size="42" font-weight="650" text-anchor="start">从文档 ID 到商品 Semantic ID / TIGER</text><text x="80" y="124" fill="#6f6a61" font-size="21" font-weight="400" text-anchor="start">DSI 证明 ID 可以生成；TIGER 让商品 ID 本身携带内容语义与层次结构。</text>
    <rect x="90" y="225" width="575" height="420" rx="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="135" y="285" fill="#1d4ed8" font-size="18" font-weight="750" text-anchor="start">ATOMIC ITEM ID</text>
    <text x="135" y="342" fill="#171612" font-size="34" font-weight="650" text-anchor="start">每件商品一个孤立 token</text>
    <text x="135" y="408" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">I01 与 I02 不共享参数</text>
<text x="135" y="458" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">词表随目录线性增长</text>
<text x="135" y="508" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">新商品没有 embedding</text>
<text x="135" y="558" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">Top-K 依赖全目录打分</text>
    <line x1="695" y1="435" x2="887" y2="435" stroke="#8b5cf6" stroke-width="5"/>
  <path d="M881 422 L905 435 L881 448" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="708" y="365" width="174" height="62" rx="31" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="795" y="405" fill="#6d28d9" font-size="20" font-weight="750" text-anchor="middle">RQ-VAE</text>
    <rect x="935" y="225" width="575" height="420" rx="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="980" y="285" fill="#166534" font-size="18" font-weight="750" text-anchor="start">SEMANTIC ID</text>
    <text x="980" y="342" fill="#171612" font-size="34" font-weight="650" text-anchor="start">一件商品是一条代码路径</text>
    <text x="980" y="408" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">4 个 code tokens</text>
<text x="980" y="458" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">相似商品共享前缀</text>
<text x="980" y="508" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">粗到细生成</text>
<text x="980" y="558" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">可由内容编码冷商品</text>
    <line x1="90" y1="710" x2="1510" y2="710" stroke="#c9c0b3" stroke-width="2" stroke-dasharray="10 10"/>
    <text x="800" y="785" fill="#92400e" font-size="24" font-weight="650" text-anchor="middle">Semantic ID 同时是压缩表示、层次地址，也是 autoregressive retrieval 的搜索路径。</text></g>
</svg>
