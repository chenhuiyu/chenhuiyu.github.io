<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ReLLa：先改数据，再调模型 / SUBR + ReiT</title>
  <desc id="desc">零样本只做检索；少样本把原始与检索增强样本混合后 instruction tuning。</desc>
  <rect width="1600" height="900" fill="#faf7f0"/>
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="82" fill="#171612" font-size="42" font-weight="650" text-anchor="start">ReLLa：先改数据，再调模型 / SUBR + ReiT</text>
  <text x="80" y="124" fill="#6f6a61" font-size="21" font-weight="400" text-anchor="start">零样本只做检索；少样本把原始与检索增强样本混合后 instruction tuning。</text>
    <rect x="85" y="220" width="275" height="270" rx="28" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="113" y="265" fill="#1d4ed8" font-size="17" font-weight="750" text-anchor="start">01</text>
      <text x="113" y="317" fill="#171612" font-size="27" font-weight="650" text-anchor="start">商品编码</text>
      <text x="113" y="365" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">描述文本 → LLM</text>
<text x="113" y="404" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">last-layer mean pool</text>
<text x="113" y="443" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">PCA → v ∈ R⁵¹²</text>
      <line x1="368" y1="355" x2="389" y2="355" stroke="#8b5cf6" stroke-width="5"/>
  <path d="M383 342 L407 355 L383 368" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="415" y="220" width="275" height="270" rx="28" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="443" y="265" fill="#6d28d9" font-size="17" font-weight="750" text-anchor="start">02</text>
      <text x="443" y="317" fill="#171612" font-size="27" font-weight="650" text-anchor="start">行为检索</text>
      <text x="443" y="365" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">target 作 query</text>
<text x="443" y="404" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">cosine similarity</text>
<text x="443" y="443" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">Top-K relevant</text>
      <line x1="698" y1="355" x2="719" y2="355" stroke="#f59e0b" stroke-width="5"/>
  <path d="M713 342 L737 355 L713 368" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="745" y="220" width="275" height="270" rx="28" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
      <text x="773" y="265" fill="#92400e" font-size="17" font-weight="750" text-anchor="start">03</text>
      <text x="773" y="317" fill="#171612" font-size="27" font-weight="650" text-anchor="start">混合数据</text>
      <text x="773" y="365" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">N 原始样本</text>
<text x="773" y="404" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">+ N 检索样本</text>
<text x="773" y="443" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">ReiT 共 2N</text>
      <line x1="1028" y1="355" x2="1049" y2="355" stroke="#10b981" stroke-width="5"/>
  <path d="M1043 342 L1067 355 L1043 368" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1075" y="220" width="275" height="270" rx="28" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="1103" y="265" fill="#166534" font-size="17" font-weight="750" text-anchor="start">04</text>
      <text x="1103" y="317" fill="#171612" font-size="27" font-weight="650" text-anchor="start">Yes / No</text>
      <text x="1103" y="365" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">causal LM tuning</text>
<text x="1103" y="404" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">读取两 token logits</text>
<text x="1103" y="443" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">得到 CTR score</text>
      
    <rect x="130" y="565" width="1340" height="135" rx="26" fill="#ffffff" stroke="#c9c0b3" stroke-width="2"/>
    <text x="800" y="612" fill="#6f6a61" font-size="18" font-weight="650" text-anchor="middle">核心公式 / central equation</text>
    <text x="800" y="665" fill="#171612" font-size="30" font-weight="650" text-anchor="middle">ŷ = exp(sYes) / [exp(sYes) + exp(sNo)]</text>
    <rect x="230" y="750" width="1140" height="70" rx="22" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="800" y="794" fill="#92400e" font-size="20" font-weight="650" text-anchor="middle">SUBR 不增加上下文长度；它改变的是选择函数。ReiT 的 pattern enrichment 还充当正则化。</text>
  </g>
</svg>
