<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">HSTU Layer：投影、聚合、门控 / High-performance block</title>
  <desc id="desc">用 pointwise aggregated attention 保留兴趣强度，用时间偏置与逐元素门控替代传统 FFN 堆叠。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172033" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C8D2E1"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#FCFAF5"/>
  <circle cx="1110" cy="70" r="160" fill="#E8F0FF" opacity=".55"/>
  <circle cx="85" cy="675" r="145" fill="#F1EAFE" opacity=".55"/>
  <text x="64" y="62" font-size="31" font-weight="760" fill="#172033">HSTU Layer：投影、聚合、门控 / High-performance block</text>
  <text x="64" y="95" font-size="17" font-weight="500" fill="#667085">用 pointwise aggregated attention 保留兴趣强度，用时间偏置与逐元素门控替代传统 FFN 堆叠。</text>
  
        <rect x="64" y="165" width="238" height="350" rx="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
        <rect x="82" y="187" width="52" height="34" rx="17" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
    <text x="108" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">01</text>
        <text x="82" y="250" text-anchor="start" font-size="21" font-weight="760" fill="#172033"><tspan x="82" dy="0">Pointwise projection</tspan></text>
        <rect x="80" y="305" width="206" height="42" rx="12" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
              <text x="183" y="332" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">X → U,V,Q,K</text><rect x="80" y="362" width="206" height="42" rx="12" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
              <text x="183" y="389" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">两次线性层</text><rect x="80" y="419" width="206" height="42" rx="12" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
              <text x="183" y="446" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">SiLU + fused kernel</text><line x1="304" y1="350" x2="318" y2="350" stroke="#C8D2E1" stroke-width="3" marker-end="url(#arrow)"/>
        <rect x="326" y="165" width="238" height="350" rx="22" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
        <rect x="344" y="187" width="52" height="34" rx="17" fill="#F1EAFE" stroke="#F1EAFE" stroke-width="2"/>
    <text x="370" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#7C3AED">02</text>
        <text x="344" y="250" text-anchor="start" font-size="21" font-weight="760" fill="#172033"><tspan x="344" dy="0">Spatial aggregation</tspan></text>
        <rect x="342" y="305" width="206" height="42" rx="12" fill="#F1EAFE" stroke="#F1EAFE" stroke-width="2"/>
              <text x="445" y="332" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">SiLU(QKᵀ + rabᵖ,ᵗ)</text><rect x="342" y="362" width="206" height="42" rx="12" fill="#F1EAFE" stroke="#F1EAFE" stroke-width="2"/>
              <text x="445" y="389" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">不用 sequence softmax</text><rect x="342" y="419" width="206" height="42" rx="12" fill="#F1EAFE" stroke="#F1EAFE" stroke-width="2"/>
              <text x="445" y="446" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">保留相关行为数量</text><line x1="566" y1="350" x2="580" y2="350" stroke="#C8D2E1" stroke-width="3" marker-end="url(#arrow)"/>
        <rect x="588" y="165" width="238" height="350" rx="22" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
        <rect x="606" y="187" width="52" height="34" rx="17" fill="#FFF3DA" stroke="#FFF3DA" stroke-width="2"/>
    <text x="632" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#D97706">03</text>
        <text x="606" y="250" text-anchor="start" font-size="21" font-weight="760" fill="#172033"><tspan x="606" dy="0">Feature interaction</tspan></text>
        <rect x="604" y="305" width="206" height="42" rx="12" fill="#FFF3DA" stroke="#FFF3DA" stroke-width="2"/>
              <text x="707" y="332" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">LayerNorm(AV)</text><rect x="604" y="362" width="206" height="42" rx="12" fill="#FFF3DA" stroke="#FFF3DA" stroke-width="2"/>
              <text x="707" y="389" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">逐元素 × U</text><rect x="604" y="419" width="206" height="42" rx="12" fill="#FFF3DA" stroke="#FFF3DA" stroke-width="2"/>
              <text x="707" y="446" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">attention 与 gate 合流</text><line x1="828" y1="350" x2="842" y2="350" stroke="#C8D2E1" stroke-width="3" marker-end="url(#arrow)"/>
        <rect x="850" y="165" width="238" height="350" rx="22" fill="#FFFFFF" stroke="#16856B" stroke-width="2"/>
        <rect x="868" y="187" width="52" height="34" rx="17" fill="#E2F5EF" stroke="#E2F5EF" stroke-width="2"/>
    <text x="894" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#16856B">04</text>
        <text x="868" y="250" text-anchor="start" font-size="21" font-weight="760" fill="#172033"><tspan x="868" dy="0">Scale system</tspan></text>
        <rect x="866" y="305" width="206" height="42" rx="12" fill="#E2F5EF" stroke="#E2F5EF" stroke-width="2"/>
              <text x="969" y="332" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">Jagged kernel</text><rect x="866" y="362" width="206" height="42" rx="12" fill="#E2F5EF" stroke="#E2F5EF" stroke-width="2"/>
              <text x="969" y="389" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">Stochastic Length</text><rect x="866" y="419" width="206" height="42" rx="12" fill="#E2F5EF" stroke="#E2F5EF" stroke-width="2"/>
              <text x="969" y="446" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">M-FALCON amortization</text>
      <rect x="190" y="545" width="820" height="78" rx="18" fill="#172033" stroke="#172033" stroke-width="2"/>
        <text x="600" y="593" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="650" fill="#FFFFFF">Y(X) = f₂( Norm( SiLU(QKᵀ + rabᵖ,ᵗ)V ) ⊙ U )</text>
  <line x1="64" y1="665" x2="1136" y2="665" stroke="#C8D2E1"/>
         <text x="64" y="696" font-size="15" fill="#667085">Source: HSTU Equations 1–3；pointwise attention 不是 softmax attention 的同义改名。</text>
</svg>