eight="700" fill="#6E8B74">CROSS-MODAL CHECK</text><text x="788" y="297" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">Color, category, fit,</text><text x="788" y="323" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">and style alignment</text><rect x="1060" y="245" width="90" height="110" rx="22" fill="#FFFDF8" stroke="#B85C5C" stroke-width="3" filter="url(#shadow)"/><rect x="1060" y="245" width="10" height="110" rx="5" fill="#B85C5C"/><text x="1088" y="285" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#B85C5C">NEW</text><text x="1088" y="317" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#17212B">Design</text><line x1="70" y1="606" x2="1130" y2="606" stroke="#C8C1B5" stroke-width="2"/><text x="70" y="642" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#6D746F">A visually plausible recommendation is not yet a manufacturable, priced, safe product.</text></svg>