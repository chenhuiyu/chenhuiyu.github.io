<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">M6-Rec 怎样把大模型塞进实时链路 / Late interaction</title>
  <desc id="desc">请求拆成可复用 segment；前 21 层离线缓存，在线只运行最后几层交互。</desc>
  <rect width="1600" height="900" fill="#faf7f0"/>
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="82" fill="#171612" font-size="42" font-weight="650" text-anchor="start">M6-Rec 怎样把大模型塞进实时链路 / Late interaction</text>
  <text x="80" y="124" fill="#6f6a61" font-size="21" font-weight="400" text-anchor="start">请求拆成可复用 segment；前 21 层离线缓存，在线只运行最后几层交互。</text>
    <rect x="85" y="220" width="275" height="270" rx="28" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="113" y="265" fill="#1d4ed8" font-size="17" font-weight="750" text-anchor="start">01</text>
      <text x="113" y="317" fill="#171612" font-size="27" font-weight="650" text-anchor="start">文本分段</text>
      <text x="113" y="365" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">画像 / 单次点击</text>
<text x="113" y="404" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">候选商品</text>
<text x="113" y="443" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">segment tokens</text>
      <line x1="368" y1="355" x2="389" y2="355" stroke="#8b5cf6" stroke-width="5"/>
  <path d="M383 342 L407 355 L383 368" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="415" y="220" width="275" height="270" rx="28" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="443" y="265" fill="#6d28d9" font-size="17" font-weight="750" text-anchor="start">02</text>
      <text x="443" y="317" fill="#171612" font-size="27" font-weight="650" text-anchor="start">深层预计算</text>
      <text x="443" y="365" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">前 L′ 层</text>
<text x="443" y="404" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">各段独立编码</text>
<text x="443" y="443" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">结果可缓存</text>
      <line x1="698" y1="355" x2="719" y2="355" stroke="#f59e0b" stroke-width="5"/>
  <path d="M713 342 L737 355 L713 368" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="745" y="220" width="275" height="270" rx="28" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
      <text x="773" y="265" fill="#92400e" font-size="17" font-weight="750" text-anchor="start">03</text>
      <text x="773" y="317" fill="#171612" font-size="27" font-weight="650" text-anchor="start">在线拼接</text>
      <text x="773" y="365" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">加入 segment emb</text>
<text x="773" y="404" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">读取最新行为</text>
<text x="773" y="443" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">candidate 组合</text>
      <line x1="1028" y1="355" x2="1049" y2="355" stroke="#10b981" stroke-width="5"/>
  <path d="M1043 342 L1067 355 L1043 368" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1075" y="220" width="275" height="270" rx="28" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="1103" y="265" fill="#166534" font-size="17" font-weight="750" text-anchor="start">04</text>
      <text x="1103" y="317" fill="#171612" font-size="27" font-weight="650" text-anchor="start">浅层交互</text>
      <text x="1103" y="365" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">最后 L−L′ 层</text>
<text x="1103" y="404" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">soft options</text>
<text x="1103" y="443" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">实时预测</text>
      
    <rect x="130" y="565" width="1340" height="135" rx="26" fill="#ffffff" stroke="#c9c0b3" stroke-width="2"/>
    <text x="800" y="612" fill="#6f6a61" font-size="18" font-weight="650" text-anchor="middle">核心公式 / central equation</text>
    <text x="800" y="665" fill="#171612" font-size="30" font-weight="650" text-anchor="middle">Lretrieval = −log exp(xᵀy/τ) / [exp(xᵀy/τ)+Σy′ exp(xᵀy′/τ)]</text>
    <rect x="230" y="750" width="1140" height="70" rx="22" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="800" y="794" fill="#92400e" font-size="20" font-weight="650" text-anchor="middle">检索用对比学习；排序与生成沿用语言建模。统一底座之上仍保留任务适配。</text>
  </g>
</svg>
