<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">从只看左边到在上下文中补空 / BERT4Rec</title>
  <desc id="desc">训练时随机遮住历史行为，让每个被遮位置同时利用左右两侧。</desc>
  <rect width="1600" height="900" fill="#faf7f0"/>
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="82" fill="#171612" font-size="42" font-weight="650" text-anchor="start">从只看左边到在上下文中补空 / BERT4Rec</text>
  <text x="80" y="124" fill="#6f6a61" font-size="21" font-weight="400" text-anchor="start">训练时随机遮住历史行为，让每个被遮位置同时利用左右两侧。</text>
    <rect x="90" y="235" width="570" height="400" rx="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="135" y="295" fill="#1d4ed8" font-size="19" font-weight="700" text-anchor="start">SASREC · LEFT-TO-RIGHT</text>
    <text x="135" y="350" fill="#171612" font-size="35" font-weight="650" text-anchor="start">位置 t 只看 1…t</text>
    <text x="135" y="410" fill="#6f6a61" font-size="23" font-weight="400" text-anchor="start">目标：预测 t+1</text>
<text x="135" y="458" fill="#6f6a61" font-size="23" font-weight="400" text-anchor="start">严格符合在线因果性</text>
<text x="135" y="506" fill="#6f6a61" font-size="23" font-weight="400" text-anchor="start">同一表示看不到右侧上下文</text>
    <path d="M690 435 H879" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
  <path d="M875 422 L895 435 L875 448" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="705" y="360" width="170" height="70" rx="35" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="790" y="404" fill="#6d28d9" font-size="21" font-weight="700" text-anchor="middle">[MASK]</text>
    <rect x="925" y="235" width="585" height="400" rx="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="970" y="295" fill="#166534" font-size="19" font-weight="700" text-anchor="start">BERT4REC · CLOZE</text>
    <text x="970" y="350" fill="#171612" font-size="35" font-weight="650" text-anchor="start">在完整历史里恢复缺失项</text>
    <text x="970" y="410" fill="#6f6a61" font-size="23" font-weight="400" text-anchor="start">随机替换多个 [MASK]</text>
<text x="970" y="458" fill="#6f6a61" font-size="23" font-weight="400" text-anchor="start">左右行为共同提供线索</text>
<text x="970" y="506" fill="#6f6a61" font-size="23" font-weight="400" text-anchor="start">一条序列产生更多监督</text>
    <line x1="90" y1="710" x2="1510" y2="710" stroke="#c9c0b3" stroke-width="2" stroke-dasharray="10 10"/>
    <text x="800" y="786" fill="#92400e" font-size="25" font-weight="650" text-anchor="middle">双向发生在训练历史内部；线上预测仍是在序列末尾追加一个 [MASK]。</text>
  </g>
</svg>
