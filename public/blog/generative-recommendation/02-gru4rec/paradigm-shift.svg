<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">从静态用户向量到会更新的 session 状态 / GRU4Rec</title>
  <desc id="desc">同一个人此刻在逛什么，可能比她长期是谁更重要。</desc>
  <rect width="1600" height="900" fill="#faf7f0"/>
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="82" fill="#171612" font-size="42" font-weight="650" text-anchor="start">从静态用户向量到会更新的 session 状态 / GRU4Rec</text>
  <text x="80" y="124" fill="#6f6a61" font-size="21" font-weight="400" text-anchor="start">同一个人此刻在逛什么，可能比她长期是谁更重要。</text>
    <rect x="90" y="235" width="570" height="400" rx="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="135" y="295" fill="#1d4ed8" font-size="19" font-weight="700" text-anchor="start">BPR-MF · 静态</text>
    <text x="135" y="350" fill="#171612" font-size="35" font-weight="650" text-anchor="start">用户是一个固定坐标</text>
    <text x="135" y="410" fill="#6f6a61" font-size="23" font-weight="400" text-anchor="start">wᵤ 概括长期偏好</text>
<text x="135" y="458" fill="#6f6a61" font-size="23" font-weight="400" text-anchor="start">事件顺序被压扁</text>
<text x="135" y="506" fill="#6f6a61" font-size="23" font-weight="400" text-anchor="start">匿名新 session 没有 wᵤ</text>
    <path d="M690 435 H879" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
  <path d="M875 422 L895 435 L875 448" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="705" y="360" width="170" height="70" rx="35" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="790" y="404" fill="#6d28d9" font-size="21" font-weight="700" text-anchor="middle">hₜ</text>
    <rect x="925" y="235" width="585" height="400" rx="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="970" y="295" fill="#166534" font-size="19" font-weight="700" text-anchor="start">GRU4REC · 动态</text>
    <text x="970" y="350" fill="#171612" font-size="35" font-weight="650" text-anchor="start">用户是正在变化的状态</text>
    <text x="970" y="410" fill="#6f6a61" font-size="23" font-weight="400" text-anchor="start">hₜ 读取当前点击</text>
<text x="970" y="458" fill="#6f6a61" font-size="23" font-weight="400" text-anchor="start">门控决定保留与更新</text>
<text x="970" y="506" fill="#6f6a61" font-size="23" font-weight="400" text-anchor="start">每一步预测下一件商品</text>
    <line x1="90" y1="710" x2="1510" y2="710" stroke="#c9c0b3" stroke-width="2" stroke-dasharray="10 10"/>
    <text x="800" y="786" fill="#92400e" font-size="25" font-weight="650" text-anchor="middle">推荐第一次认真回答：用户刚刚做过什么，会怎样改变下一步。</text>
  </g>
</svg>
