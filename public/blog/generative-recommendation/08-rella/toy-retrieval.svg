<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">推荐泳镜时，哪些历史值得带进 prompt？ / SUBR toy</title>
  <desc id="desc">完整历史包含八件商品；预算只允许保留四件。</desc>
  <rect width="1600" height="900" fill="#faf7f0"/>
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="82" fill="#171612" font-size="42" font-weight="650" text-anchor="start">推荐泳镜时，哪些历史值得带进 prompt？ / SUBR toy</text>
  <text x="80" y="124" fill="#6f6a61" font-size="21" font-weight="400" text-anchor="start">完整历史包含八件商品；预算只允许保留四件。</text>
    <rect x="77" y="220" width="335" height="420" rx="28" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="111" y="270" fill="#1d4ed8" font-size="17" font-weight="750" text-anchor="start">01</text>
      <text x="111" y="325" fill="#171612" font-size="27" font-weight="650" text-anchor="start">目标 / Query</text>
      <text x="111" y="385" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">I06 泳镜</text>
<text x="111" y="430" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">游泳 · 防雾</text>
<text x="111" y="475" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">编码成 vtarget</text>
<rect x="447" y="220" width="335" height="420" rx="28" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="481" y="270" fill="#6d28d9" font-size="17" font-weight="750" text-anchor="start">02</text>
      <text x="481" y="325" fill="#171612" font-size="27" font-weight="650" text-anchor="start">最近四件</text>
      <text x="481" y="385" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">蛋白棒 / 粉袋</text>
<text x="481" y="430" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">羽毛球 / 瑜伽垫</text>
<text x="481" y="475" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">主题混杂</text>
<rect x="817" y="220" width="335" height="420" rx="28" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
      <text x="851" y="270" fill="#92400e" font-size="17" font-weight="750" text-anchor="start">03</text>
      <text x="851" y="325" fill="#171612" font-size="27" font-weight="650" text-anchor="start">语义检索</text>
      <text x="851" y="385" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">I06 与每件历史</text>
<text x="851" y="430" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">计算 cosine</text>
<text x="851" y="475" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">按相关度排序</text>
<rect x="1187" y="220" width="335" height="420" rx="28" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="1221" y="270" fill="#166534" font-size="17" font-weight="750" text-anchor="start">04</text>
      <text x="1221" y="325" fill="#171612" font-size="27" font-weight="650" text-anchor="start">相关四件</text>
      <text x="1221" y="385" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">泳帽 / 运动毛巾</text>
<text x="1221" y="430" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">羽毛球 / 网球拍</text>
<text x="1221" y="475" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">再写入 prompt</text>
    <rect x="235" y="705" width="1130" height="100" rx="25" fill="#ffffff" stroke="#c9c0b3" stroke-width="2"/>
    <text x="800" y="765" fill="#171612" font-size="22" font-weight="650" text-anchor="middle">示例只解释机制；原论文用 LLM hidden states + PCA 得到 512 维商品语义向量。</text>
  </g>
</svg>
