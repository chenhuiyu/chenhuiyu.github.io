<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BPR-MF 从三元组到一次参数更新 / Data flow</title>
  <desc id="desc">以 batch size B、隐向量维度 d 为例；原论文的 LearnBPR 每次随机抽一个三元组。</desc>
  <rect width="1600" height="900" fill="#faf7f0"/>
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="82" fill="#171612" font-size="42" font-weight="650" text-anchor="start">BPR-MF 从三元组到一次参数更新 / Data flow</text>
  <text x="80" y="124" fill="#6f6a61" font-size="21" font-weight="400" text-anchor="start">以 batch size B、隐向量维度 d 为例；原论文的 LearnBPR 每次随机抽一个三元组。</text>
    <rect x="85" y="235" width="275" height="245" rx="28" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="113" y="278" fill="#1d4ed8" font-size="18" font-weight="750" text-anchor="start">01</text>
      <text x="113" y="327" fill="#171612" font-size="28" font-weight="650" text-anchor="start">采样</text>
      <text x="113" y="374" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">(u, i, j)</text>
<text x="113" y="411" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">i：已观察</text>
<text x="113" y="448" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">j：未观察</text>
      <path d="M368 355 H391" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
  <path d="M387 342 L407 355 L387 368" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="415" y="235" width="275" height="245" rx="28" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="443" y="278" fill="#6d28d9" font-size="18" font-weight="750" text-anchor="start">02</text>
      <text x="443" y="327" fill="#171612" font-size="28" font-weight="650" text-anchor="start">查向量</text>
      <text x="443" y="374" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">wᵤ ∈ Rᵈ</text>
<text x="443" y="411" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">hᵢ,hⱼ ∈ Rᵈ</text>
<text x="443" y="448" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">参数共享</text>
      <path d="M698 355 H721" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <path d="M717 342 L737 355 L717 368" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="745" y="235" width="275" height="245" rx="28" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
      <text x="773" y="278" fill="#92400e" font-size="18" font-weight="750" text-anchor="start">03</text>
      <text x="773" y="327" fill="#171612" font-size="28" font-weight="650" text-anchor="start">比分差</text>
      <text x="773" y="374" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">x̂ᵤᵢ = wᵤ·hᵢ</text>
<text x="773" y="411" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">x̂ᵤⱼ = wᵤ·hⱼ</text>
<text x="773" y="448" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">Δ = x̂ᵤᵢ−x̂ᵤⱼ</text>
      <path d="M1028 355 H1051" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  <path d="M1047 342 L1067 355 L1047 368" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1075" y="235" width="275" height="245" rx="28" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="1103" y="278" fill="#166534" font-size="18" font-weight="750" text-anchor="start">04</text>
      <text x="1103" y="327" fill="#171612" font-size="28" font-weight="650" text-anchor="start">更新</text>
      <text x="1103" y="374" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">最大化 log σ(Δ)</text>
<text x="1103" y="411" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">加入 L2 prior</text>
<text x="1103" y="448" fill="#6f6a61" font-size="18" font-weight="400" text-anchor="start">bootstrap SGD</text>
      
    <rect x="130" y="570" width="1340" height="135" rx="26" fill="#ffffff" stroke="#c9c0b3" stroke-width="2"/>
    <text x="800" y="618" fill="#6f6a61" font-size="19" font-weight="650" text-anchor="middle">核心公式 / central equation</text>
    <text x="800" y="670" fill="#171612" font-size="31" font-weight="650" text-anchor="middle">BPR-Opt = Σ(u,i,j)∈Dₛ log σ(x̂ᵤᵢ − x̂ᵤⱼ) − λ‖Θ‖²</text>
    <rect x="230" y="755" width="1140" height="68" rx="22" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="800" y="798" fill="#92400e" font-size="20" font-weight="650" text-anchor="middle">单次 MF 更新约 O(d)；推理仍需给候选商品打分并取 Top-K。</text>
  </g>
</svg>
