<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">从一次 Top-K 到逐项写列表 / GPTRec</title><desc id="desc">Top-K 独立取最高分；Next-K 让第 k 件推荐依赖前面已经选出的列表。</desc>
  <rect width="1600" height="900" fill="#faf7f0"/>
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="80" y="82" fill="#171612" font-size="42" font-weight="650" text-anchor="start">从一次 Top-K 到逐项写列表 / GPTRec</text><text x="80" y="124" fill="#6f6a61" font-size="21" font-weight="400" text-anchor="start">Top-K 独立取最高分；Next-K 让第 k 件推荐依赖前面已经选出的列表。</text>
    <rect x="90" y="225" width="575" height="420" rx="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="135" y="285" fill="#1d4ed8" font-size="18" font-weight="750" text-anchor="start">TOP-K</text>
    <text x="135" y="342" fill="#171612" font-size="34" font-weight="650" text-anchor="start">一次打分，截取前 K</text>
    <text x="135" y="408" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">score(i | history)</text>
<text x="135" y="458" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">商品彼此不看</text>
<text x="135" y="508" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">速度快</text>
<text x="135" y="558" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">难直接表达列表整体目标</text>
    <line x1="695" y1="435" x2="887" y2="435" stroke="#8b5cf6" stroke-width="5"/>
  <path d="M881 422 L905 435 L881 448" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="708" y="365" width="174" height="62" rx="31" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="795" y="405" fill="#6d28d9" font-size="20" font-weight="750" text-anchor="middle">list LM</text>
    <rect x="935" y="225" width="575" height="420" rx="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="980" y="285" fill="#166534" font-size="18" font-weight="750" text-anchor="start">NEXT-K</text>
    <text x="980" y="342" fill="#171612" font-size="34" font-weight="650" text-anchor="start">推荐列表自回归生成</text>
    <text x="980" y="408" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">P(rₖ | history,r&lt;k)</text>
<text x="980" y="458" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">避免重复</text>
<text x="980" y="508" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">可建模互补 / 多样</text>
<text x="980" y="558" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">需要 K 次前向</text>
    <line x1="90" y1="710" x2="1510" y2="710" stroke="#c9c0b3" stroke-width="2" stroke-dasharray="10 10"/>
    <text x="800" y="785" fill="#92400e" font-size="24" font-weight="650" text-anchor="middle">生成式推荐不只改变商品表示，也改变“列表”这一输出对象的概率分解。</text></g>
</svg>
