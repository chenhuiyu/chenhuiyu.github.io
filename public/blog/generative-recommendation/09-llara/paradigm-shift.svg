<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">商品有两种知识：它是什么，谁会喜欢 / LLaRA</title>
  <desc id="desc">文本 token 调用世界知识；传统推荐器的 ID embedding 保存协同行为。二者缺一不可。</desc>
  <rect width="1600" height="900" fill="#faf7f0"/>
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="82" fill="#171612" font-size="42" font-weight="650" text-anchor="start">商品有两种知识：它是什么，谁会喜欢 / LLaRA</text>
  <text x="80" y="124" fill="#6f6a61" font-size="21" font-weight="400" text-anchor="start">文本 token 调用世界知识；传统推荐器的 ID embedding 保存协同行为。二者缺一不可。</text>
    <rect x="90" y="225" width="575" height="420" rx="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="135" y="285" fill="#1d4ed8" font-size="18" font-weight="750" text-anchor="start">TEXT ONLY</text>
    <text x="135" y="342" fill="#171612" font-size="34" font-weight="650" text-anchor="start">LLM 知道商品的含义</text>
    <text x="135" y="408" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">“泳镜”与游泳有关</text>
<text x="135" y="458" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">可解释标题与描述</text>
<text x="135" y="508" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">冷商品也有语义</text>
<text x="135" y="558" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">难学匿名共现规律</text>
    <line x1="695" y1="435" x2="887" y2="435" stroke="#8b5cf6" stroke-width="5"/>
  <path d="M881 422 L905 435 L881 448" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="708" y="365" width="174" height="62" rx="31" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="795" y="405" fill="#6d28d9" font-size="20" font-weight="750" text-anchor="middle">align</text>
    <rect x="935" y="225" width="575" height="420" rx="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="980" y="285" fill="#166534" font-size="18" font-weight="750" text-anchor="start">HYBRID TOKEN</text>
    <text x="980" y="342" fill="#171612" font-size="34" font-weight="650" text-anchor="start">语义与行为并排输入</text>
    <text x="980" y="408" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">title tokens</text>
<text x="980" y="458" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">+ projected ID embedding</text>
<text x="980" y="508" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">LLM 空间内融合</text>
<text x="980" y="558" fill="#6f6a61" font-size="22" font-weight="400" text-anchor="start">候选与历史同样表示</text>
    <line x1="90" y1="710" x2="1510" y2="710" stroke="#c9c0b3" stroke-width="2" stroke-dasharray="10 10"/>
    <text x="800" y="785" fill="#92400e" font-size="24" font-weight="650" text-anchor="middle">LLaRA 不是用 LLM 替换推荐器，而是把推荐器当作一种新模态接入 LLM。</text>
  </g>
</svg>
