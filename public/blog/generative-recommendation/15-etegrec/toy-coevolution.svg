<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">同一个 I06，谁来告诉 tokenizer 应该怎样编码？ / ETEGRec toy</title><desc id="desc">目标泳镜的代码不只重构自身 embedding，还要与用户序列和 decoder preference 对齐。</desc>
  <rect width="1600" height="900" fill="#faf7f0"/>
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="80" y="82" fill="#171612" font-size="42" font-weight="650" text-anchor="start">同一个 I06，谁来告诉 tokenizer 应该怎样编码？ / ETEGRec toy</text><text x="80" y="124" fill="#6f6a61" font-size="21" font-weight="400" text-anchor="start">目标泳镜的代码不只重构自身 embedding，还要与用户序列和 decoder preference 对齐。</text><rect x="77" y="220" width="335" height="420" rx="28" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="111" y="270" fill="#1d4ed8" font-size="17" font-weight="750" text-anchor="start">01</text>
      <text x="111" y="325" fill="#171612" font-size="27" font-weight="650" text-anchor="start">Tokenizer 视角</text>
      <text x="111" y="385" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">I06 collaborative z</text>
<text x="111" y="430" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">RQ-VAE → 〈4,2,1〉</text>
<text x="111" y="475" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">重构 z̃</text>
<rect x="447" y="220" width="335" height="420" rx="28" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="481" y="270" fill="#6d28d9" font-size="17" font-weight="750" text-anchor="start">02</text>
      <text x="481" y="325" fill="#171612" font-size="27" font-weight="650" text-anchor="start">Encoder 视角</text>
      <text x="481" y="385" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">I01,I03,I05 codes</text>
<text x="481" y="430" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">得到 sequence zᴱ</text>
<text x="481" y="475" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">应预测相同 code 分布</text>
<rect x="817" y="220" width="335" height="420" rx="28" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
      <text x="851" y="270" fill="#92400e" font-size="17" font-weight="750" text-anchor="start">03</text>
      <text x="851" y="325" fill="#171612" font-size="27" font-weight="650" text-anchor="start">Decoder 视角</text>
      <text x="851" y="385" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">BOS hidden hᴰ</text>
<text x="851" y="430" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">代表当前偏好</text>
<text x="851" y="475" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">应接近 I06 的 z̃</text>
<rect x="1187" y="220" width="335" height="420" rx="28" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="1221" y="270" fill="#166534" font-size="17" font-weight="750" text-anchor="start">04</text>
      <text x="1221" y="325" fill="#171612" font-size="27" font-weight="650" text-anchor="start">交替更新</text>
      <text x="1221" y="385" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">先冻 recommender 调码</text>
<text x="1221" y="430" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">再冻 tokenizer 学生成</text>
<text x="1221" y="475" fill="#6f6a61" font-size="19" font-weight="400" text-anchor="start">多 cycle 后稳定</text>
    <rect x="235" y="705" width="1130" height="100" rx="25" fill="#ffffff" stroke="#c9c0b3" stroke-width="2"/>
    <text x="800" y="765" fill="#171612" font-size="22" font-weight="650" text-anchor="middle">SIA 对齐“历史指向哪个 item code”；PSA 对齐“偏好状态接近哪个 item semantics”。</text></g>
</svg>
