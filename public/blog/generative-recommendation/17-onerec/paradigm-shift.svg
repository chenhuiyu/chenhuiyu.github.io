<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">从三级漏斗到一次生成 / Unify Retrieve and Rank</title>
  <desc id="desc">OneRec 让同一个模型生成最终 session，并把 session 级业务偏好直接对齐到输出分布。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172033" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C8D2E1"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#FCFAF5"/>
  <circle cx="1110" cy="70" r="160" fill="#E8F0FF" opacity=".55"/>
  <circle cx="85" cy="675" r="145" fill="#F1EAFE" opacity=".55"/>
  <text x="64" y="62" font-size="31" font-weight="760" fill="#172033">从三级漏斗到一次生成 / Unify Retrieve and Rank</text>
  <text x="64" y="95" font-size="17" font-weight="500" fill="#667085">OneRec 让同一个模型生成最终 session，并把 session 级业务偏好直接对齐到输出分布。</text>
  <rect x="64" y="145" width="430" height="430" rx="22" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
      <rect x="92" y="170" width="133" height="34" rx="17" fill="#FFF3DA" stroke="#FFF3DA" stroke-width="2"/>
    <text x="158.5" y="193" text-anchor="middle" font-size="15" font-weight="700" fill="#D97706">Cascade</text>
      <text x="92" y="235" text-anchor="start" font-size="26" font-weight="760" fill="#172033"><tspan x="92" dy="0">Retrieve → Pre-rank → Rank</tspan></text>
      <rect x="92" y="290" width="374" height="50" rx="14" fill="#FFF3DA" stroke="#FFF3DA" stroke-width="2"/>
            <circle cx="116" cy="315" r="7" fill="#D97706"/>
            <text x="134" y="321" font-size="17" font-weight="600" fill="#172033">每级只看上一级候选</text><rect x="92" y="360" width="374" height="50" rx="14" fill="#FFF3DA" stroke="#FFF3DA" stroke-width="2"/>
            <circle cx="116" cy="385" r="7" fill="#D97706"/>
            <text x="134" y="391" font-size="17" font-weight="600" fill="#172033">前级漏掉后级无法挽回</text><rect x="92" y="430" width="374" height="50" rx="14" fill="#FFF3DA" stroke="#FFF3DA" stroke-width="2"/>
            <circle cx="116" cy="455" r="7" fill="#D97706"/>
            <text x="134" y="461" font-size="17" font-weight="600" fill="#172033">多个目标分别调参</text><rect x="92" y="500" width="374" height="50" rx="14" fill="#FFF3DA" stroke="#FFF3DA" stroke-width="2"/>
            <circle cx="116" cy="525" r="7" fill="#D97706"/>
            <text x="134" y="531" font-size="17" font-weight="600" fill="#172033">列表靠规则拼接</text>
      <line x1="520" y1="360" x2="680" y2="360" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="535" y="314" width="130" height="92" rx="46" fill="#F1EAFE" stroke="#7C3AED" stroke-width="2"/>
      <text x="600" y="348" text-anchor="middle" font-size="16" font-weight="760" fill="#7C3AED"><tspan x="600" dy="0">单阶段</tspan><tspan x="600" dy="22">列表生成</tspan></text>
      <rect x="706" y="145" width="430" height="430" rx="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
      <rect x="734" y="170" width="118" height="34" rx="17" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
    <text x="793" y="193" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">OneRec</text>
      <text x="734" y="235" text-anchor="start" font-size="26" font-weight="760" fill="#172033"><tspan x="734" dy="0">History → Session</tspan></text>
      <rect x="734" y="290" width="374" height="50" rx="14" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
            <circle cx="758" cy="315" r="7" fill="#2563EB"/>
            <text x="776" y="321" font-size="17" font-weight="600" fill="#172033">Balanced Semantic IDs</text><rect x="734" y="360" width="374" height="50" rx="14" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
            <circle cx="758" cy="385" r="7" fill="#2563EB"/>
            <text x="776" y="391" font-size="17" font-weight="600" fill="#172033">Sparse MoE 扩容量</text><rect x="734" y="430" width="374" height="50" rx="14" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
            <circle cx="758" cy="455" r="7" fill="#2563EB"/>
            <text x="776" y="461" font-size="17" font-weight="600" fill="#172033">一次写 5–10 个视频</text><rect x="734" y="500" width="374" height="50" rx="14" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
            <circle cx="758" cy="525" r="7" fill="#2563EB"/>
            <text x="776" y="531" font-size="17" font-weight="600" fill="#172033">RM + DPO 对齐业务奖励</text>
  <line x1="64" y1="665" x2="1136" y2="665" stroke="#C8D2E1"/>
         <text x="64" y="696" font-size="15" fill="#667085">统一优化减少级联上限，但在线仍需要 codebook、beam、奖励模型与增量训练系统。</text>
</svg>