<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">用户级压缩：用户算一次，候选共享 / User aggregation</title>
  <desc id="desc">同一请求的候选被聚合到一个 token 序列，避免为每个候选重复编码历史。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172033" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C8D2E1"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#FCFAF5"/>
  <circle cx="1110" cy="70" r="160" fill="#E8F0FF" opacity=".55"/>
  <circle cx="85" cy="675" r="145" fill="#F1EAFE" opacity=".55"/>
  <text x="64" y="62" font-size="31" font-weight="760" fill="#172033">用户级压缩：用户算一次，候选共享 / User aggregation</text>
  <text x="64" y="95" font-size="17" font-weight="500" fill="#667085">同一请求的候选被聚合到一个 token 序列，避免为每个候选重复编码历史。</text>
  <rect x="64" y="155" width="252" height="445" rx="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
          <rect x="82" y="179" width="88" height="34" rx="17" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
    <text x="126" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">共享用户</text>
          <text x="82" y="245" text-anchor="start" font-size="21" font-weight="760" fill="#172033"><tspan x="82" dy="0">Static tokens</tspan></text>
          <rect x="80" y="303" width="220" height="48" rx="12" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
                <text x="190" y="333" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">年龄 / 城市</text><rect x="80" y="368" width="220" height="48" rx="12" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
                <text x="190" y="398" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">I01,I03,I05 历史</text><rect x="80" y="433" width="220" height="48" rx="12" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
                <text x="190" y="463" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">请求前长期序列</text><rect x="80" y="498" width="220" height="48" rx="12" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
                <text x="190" y="528" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">所有候选可见</text><rect x="334" y="155" width="252" height="445" rx="22" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
          <rect x="352" y="179" width="88" height="34" rx="17" fill="#F1EAFE" stroke="#F1EAFE" stroke-width="2"/>
    <text x="396" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#7C3AED">实时行为</text>
          <text x="352" y="245" text-anchor="start" font-size="21" font-weight="760" fill="#172033"><tspan x="352" dy="0">Dynamic tokens</tspan></text>
          <rect x="350" y="303" width="220" height="48" rx="12" fill="#F1EAFE" stroke="#F1EAFE" stroke-width="2"/>
                <text x="460" y="333" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">I07 刚刚收藏</text><rect x="350" y="368" width="220" height="48" rx="12" fill="#F1EAFE" stroke="#F1EAFE" stroke-width="2"/>
                <text x="460" y="398" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">按时间因果可见</text><rect x="350" y="433" width="220" height="48" rx="12" fill="#F1EAFE" stroke="#F1EAFE" stroke-width="2"/>
                <text x="460" y="463" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">禁止看见未来事件</text><rect x="350" y="498" width="220" height="48" rx="12" fill="#F1EAFE" stroke="#F1EAFE" stroke-width="2"/>
                <text x="460" y="528" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">dynamic mask</text><rect x="604" y="155" width="252" height="445" rx="22" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
          <rect x="622" y="179" width="118" height="34" rx="17" fill="#FFF3DA" stroke="#FFF3DA" stroke-width="2"/>
    <text x="681" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#D97706">候选 I06</text>
          <text x="622" y="245" text-anchor="start" font-size="21" font-weight="760" fill="#172033"><tspan x="622" dy="0">Cross token</tspan></text>
          <rect x="620" y="303" width="220" height="48" rx="12" fill="#FFF3DA" stroke="#FFF3DA" stroke-width="2"/>
                <text x="730" y="333" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">商品 ID / 类目</text><rect x="620" y="368" width="220" height="48" rx="12" fill="#FFF3DA" stroke="#FFF3DA" stroke-width="2"/>
                <text x="730" y="398" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">user×item CTR</text><rect x="620" y="433" width="220" height="48" rx="12" fill="#FFF3DA" stroke="#FFF3DA" stroke-width="2"/>
                <text x="730" y="463" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">历史曝光次数</text><rect x="620" y="498" width="220" height="48" rx="12" fill="#FFF3DA" stroke="#FFF3DA" stroke-width="2"/>
                <text x="730" y="528" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">输出 click score</text><rect x="874" y="155" width="252" height="445" rx="22" fill="#FFFFFF" stroke="#16856B" stroke-width="2"/>
          <rect x="892" y="179" width="118" height="34" rx="17" fill="#E2F5EF" stroke="#E2F5EF" stroke-width="2"/>
    <text x="951" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#16856B">候选 I08</text>
          <text x="892" y="245" text-anchor="start" font-size="21" font-weight="760" fill="#172033"><tspan x="892" dy="0">Cross token</tspan></text>
          <rect x="890" y="303" width="220" height="48" rx="12" fill="#E2F5EF" stroke="#E2F5EF" stroke-width="2"/>
                <text x="1000" y="333" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">另一组 cross stats</text><rect x="890" y="368" width="220" height="48" rx="12" fill="#E2F5EF" stroke="#E2F5EF" stroke-width="2"/>
                <text x="1000" y="398" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">与 I06 同批计算</text><rect x="890" y="433" width="220" height="48" rx="12" fill="#E2F5EF" stroke="#E2F5EF" stroke-width="2"/>
                <text x="1000" y="463" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">候选间按规则遮罩</text><rect x="890" y="498" width="220" height="48" rx="12" fill="#E2F5EF" stroke="#E2F5EF" stroke-width="2"/>
                <text x="1000" y="528" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">输出 conversion score</text>
  <line x1="64" y1="665" x2="1136" y2="665" stroke="#C8D2E1"/>
         <text x="64" y="696" font-size="15" fill="#667085">传统 K 个 pair samples 变为 1 个 user-level sample；推理成本对候选数呈次线性增长。</text>
</svg>