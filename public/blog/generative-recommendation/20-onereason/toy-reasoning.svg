                <text x="730" y="398" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">近期转向游泳</text><rect x="620" y="433" width="220" height="48" rx="12" fill="#FFF3DA" stroke="#FFF3DA" stroke-width="2"/>
