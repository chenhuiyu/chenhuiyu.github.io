<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">从八件商品走完 R0 → R3 / A diagnostic ladder</title>
  <desc id="desc">每一层都可独立评测；高层失败不再被笼统归因于“模型不够大”。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172033" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#C8D2E1"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#FCFAF5"/>
  <circle cx="1110" cy="70" r="160" fill="#E8F0FF" opacity=".55"/>
  <circle cx="85" cy="675" r="145" fill="#F1EAFE" opacity=".55"/>
  <text x="64" y="62" font-size="31" font-weight="760" fill="#172033">从八件商品走完 R0 → R3 / A diagnostic ladder</text>
  <text x="64" y="95" font-size="17" font-weight="500" fill="#667085">每一层都可独立评测；高层失败不再被笼统归因于“模型不够大”。</text>
  <rect x="64" y="155" width="252" height="445" rx="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
          <rect x="82" y="179" width="82" height="34" rx="17" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
    <text x="123" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">R0</text>
          <text x="82" y="245" text-anchor="start" font-size="21" font-weight="760" fill="#172033"><tspan x="82" dy="0">Perception</tspan></text>
          <rect x="80" y="303" width="220" height="48" rx="12" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
                <text x="190" y="333" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">读出 I07 是泳帽</text><rect x="80" y="368" width="220" height="48" rx="12" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
                <text x="190" y="398" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">理解三级 code</text><rect x="80" y="433" width="220" height="48" rx="12" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
                <text x="190" y="463" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">内容 / 图像 / 音频对齐</text><rect x="80" y="498" width="220" height="48" rx="12" fill="#E8F0FF" stroke="#E8F0FF" stroke-width="2"/>
                <text x="190" y="528" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">否则历史不可读</text><rect x="334" y="155" width="252" height="445" rx="22" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
          <rect x="352" y="179" width="82" height="34" rx="17" fill="#F1EAFE" stroke="#F1EAFE" stroke-width="2"/>
    <text x="393" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#7C3AED">R1</text>
          <text x="352" y="245" text-anchor="start" font-size="21" font-weight="760" fill="#172033"><tspan x="352" dy="0">Derivation</tspan></text>
          <rect x="350" y="303" width="220" height="48" rx="12" fill="#F1EAFE" stroke="#F1EAFE" stroke-width="2"/>
                <text x="460" y="333" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">泳帽 → 泳镜</text><rect x="350" y="368" width="220" height="48" rx="12" fill="#F1EAFE" stroke="#F1EAFE" stroke-width="2"/>
                <text x="460" y="398" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">攀岩鞋 → 镁粉袋</text><rect x="350" y="433" width="220" height="48" rx="12" fill="#F1EAFE" stroke="#F1EAFE" stroke-width="2"/>
                <text x="460" y="463" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">常识 + 协同 bridge</text><rect x="350" y="498" width="220" height="48" rx="12" fill="#F1EAFE" stroke="#F1EAFE" stroke-width="2"/>
                <text x="460" y="528" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">从单件抽潜在兴趣</text><rect x="604" y="155" width="252" height="445" rx="22" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
          <rect x="622" y="179" width="82" height="34" rx="17" fill="#FFF3DA" stroke="#FFF3DA" stroke-width="2"/>
    <text x="663" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#D97706">R2</text>
          <text x="622" y="245" text-anchor="start" font-size="21" font-weight="760" fill="#172033"><tspan x="622" dy="0">Evolution</tspan></text>
