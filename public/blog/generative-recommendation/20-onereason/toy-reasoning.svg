                <text x="730" y="528" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">识别细化与饱和</text><rect x="874" y="155" width="252" height="445" rx="22" fill="#FFFFFF" stroke="#16856B" stroke-width="2"/>
          <rect x="892" y="179" width="82" height="34" rx="17" fill="#E2F5EF" stroke="#E2F5EF" stroke-width="2"/>
    <text x="933" y="202" text-anchor="middle" font-size="15" font-weight="700" fill="#16856B">R3</text>
          <text x="892" y="245" text-anchor="start" font-size="21" font-weight="760" fill="#172033"><tspan x="892" dy="0">Recommendation</tspan></text>
