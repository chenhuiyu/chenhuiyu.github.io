                <text x="1000" y="333" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">压缩 persona</text><rect x="890" y="368" width="220" height="48" rx="12" fill="#E2F5EF" stroke="#E2F5EF" stroke-width="2"/>
                <text x="1000" y="398" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">压缩兴趣演化</text><rect x="890" y="433" width="220" height="48" rx="12" fill="#E2F5EF" stroke="#E2F5EF" stroke-width="2"/>
                <text x="1000" y="463" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">比较多条候选方向</text><rect x="890" y="498" width="220" height="48" rx="12" fill="#E2F5EF" stroke="#E2F5EF" stroke-width="2"/>
                <text x="1000" y="528" text-anchor="middle" font-size="15" font-weight="620" fill="#172033">生成 I06 / I08</text>
  <line x1="64" y1="665" x2="1136" y2="665" stroke="#C8D2E1"/>
         <text x="64" y="696" font-size="15" fill="#667085">R3 trace 禁止直接出现 ground-truth target；目标只在 &lt;think&gt; 之后作为监督答案。</text>
