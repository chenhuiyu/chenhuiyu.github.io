name: Publish GitHub Pages

on:
  push:
    branches:
      - source
  workflow_dispatch:

concurrency:
  group: github-pages-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish master
        run: npm run publish:github-pages
        env:
          PUBLISH_CONFIRM: "YES"
